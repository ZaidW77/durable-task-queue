[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "durable-task-queue"
version = "0.1.0"
description = "Educational SQLite task queue with leases, retries, and dead letters"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/ZaidW77/durable-task-queue"

[tool.setuptools]
packages = ["durablequeue"]
